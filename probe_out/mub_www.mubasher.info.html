  <!-- Inter is self-hosted via styles.scss. flag-icons is vendored as a plain
       static asset (not run through the CSS/JS bundler): its 4x3/ and 1x1/
       folders both ship a handful of identically-named files with different
       content (e.g. xk.svg, un.svg), which esbuild's asset pipeline can't
       dedupe — it hard-errors on the collision. A <link> to the copied file
       under src/assets sidesteps that entirely while still being same-origin. -->
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin="">
  <!-- Preload the ad banner placeholder where it is the LCP element: phones (compact file) -->
  <link rel="preload" as="image" href="assets/images/landing-page-ad-phone.webp" type="image/webp" media="(max-width: 767px)">
  <!-- Starts the federation manifest fetch at parse time instead of waiting for the
       market-talks route to be activated, since loadRemoteModule() blocks on it first. -->
  <link rel="preload" href="/federation.manifest.json" as="fetch" crossorigin="anonymous">
  <!-- Loaded without blocking the first paint. It is 28KB of render-blocking CSS on EVERY
       route, and the only things that use its fi-* classes are the /advertise page and two
       shared-auth screens (country-phone-input, onboarding) -- none of them on the homepage.
       media="print" makes the browser fetch it at low priority and apply nothing; onload
       promotes it to all once it has arrived. It cannot be moved into the bundler for the
       reason given above, so this is how it stops blocking. -->
  <link rel="stylesheet" href="assets/flag-icons/css/flag-icons.min.css" media="print" onload="this.media='all'; this.onload=null">
  <noscript><link rel="stylesheet" href="assets/flag-icons/css/flag-icons.min.css"></noscript>
  <!-- Deployment's site domains (SITE_* in .env) as window.__MI_SITE__, before the app
       boots — served by the BFF, see src/bff/routes/site-config.routes.ts. -->
  <script src="/site-config.js"></script>
