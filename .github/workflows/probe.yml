name: Probe data sources
on:
  push:
    branches: [upgrade-signals]
    paths: [tools/probe_sources.py, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests yfinance
      - run: python tools/probe_sources.py
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: probe_out}
