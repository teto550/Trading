name: Probe data sources
on:
  push:
    branches: [upgrade-signals]
    paths: [tools/probe_sources.py, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests yfinance
      - run: python tools/probe_sources.py
      - name: commit
        run: |
          git config user.name probe-bot; git config user.email bot@users.noreply.github.com
          git add -f probe_out && git commit -m "probe output [skip ci]" && git push
