name: Telegram Commands
on:
  schedule:
    # الـjob بيفضل شغال حوالي 5.5 ساعة وبيسأل تليجرام كل ~15 ثانية (فالرد في ثواني)، وكل ساعة بيتجدول واحد
    # جديد يستنى في الطابور (concurrency) لحد ما اللي شغال يخلص، فالتغطية متصلة تقريبًا.
    # cron بتاع GitHub بيتأخر أحيانًا، فممكن يحصل فجوة قصيرة بين job وjob.
    - cron: "13 * * * *"
  workflow_dispatch:
concurrency:
  group: commands
  cancel-in-progress: false
jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Answer Telegram messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python monitor_once.py --commands --poll 20000
      - name: Save last answered message
        if: always()
        run: |
          git config user.name "alert-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f tg_offset.txt ]; then
            git add tg_offset.txt
          fi
          git diff --cached --quiet && exit 0
          git commit -m "update tg offset [skip ci]"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" || true
          git push
