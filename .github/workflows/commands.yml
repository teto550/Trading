name: Telegram Commands
on:
  schedule:
    # بيشوف رسايل تليجرام كل 5 دقايق (8 الصبح لـ 12 بالليل بتوقيت القاهرة تقريبًا)
    # GitHub ممكن يأخّره، فالرد مش لحظي بس غالبًا في دقايق
    - cron: "*/5 5-20 * * *"
  workflow_dispatch:
concurrency:
  group: commands
  cancel-in-progress: false
jobs:
  commands:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Answer Telegram messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python monitor_once.py --commands
      - name: Save last answered message
        run: |
          git config user.name "alert-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f tg_offset.txt ]; then
            git add tg_offset.txt
          fi
          git diff --cached --quiet && exit 0
          git commit -m "update tg offset [skip ci]"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" || true
          git push
