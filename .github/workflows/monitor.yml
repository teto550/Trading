name: Live Stock Monitor
on:
  schedule:
    # 3 مرات في اليوم (10 و11 و12 UTC)، الأحد للخميس فقط. في الصيفي
    # والشتوي على الأقل run واحد بيقع جوه ساعات EGX، وآخر run جوه
    # السوق هو اللي بيحدّث قفلة اليوم. (cron بتاع GitHub بيتأخر
    # ومش مضمون للتكرار العالي، فمفيش داعي لكل 15 دقيقة)
    - cron: "0 10,11,12 * * 0-4"
  workflow_dispatch:
    inputs:
      force_run:
        description: "تجاهل مواعيد السوق (للتجربة اليدوية بس)"
        required: false
        default: "false"
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run monitor
        env:
          # قايمة الأسهم بتتقري من tickers.txt (GGRN اتشال: مش مغطى في
          # yfinance خالص). لو حطيت TICKERS هنا هي اللي هتتاخد بدل الملف.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: python monitor_once.py
      - name: Commit updated state
        run: |
          git config user.name "alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          # alert_log.csv بيتعمل بس أول ما يحصل تنبيه فعلي - لسه مش
          # موجود في أول تشغيلات، فبنضيفه بس لو موجود عشان الأمر
          # ميفشلش
          if [ -f alert_log.csv ]; then
            git add alert_log.csv
          fi
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git push
