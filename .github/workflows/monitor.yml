name: Live Stock Monitor
on:
  schedule:
    # 3 مرات في اليوم (10 و11 و12 UTC)، الأحد للخميس فقط. في الصيفي
    # والشتوي على الأقل run واحد بيقع جوه ساعات EGX، وآخر run جوه
    # السوق هو اللي بيحدّث قفلة اليوم. (cron بتاع GitHub بيتأخر
    # ومش مضمون للتكرار العالي، فمفيش داعي لكل 15 دقيقة)
    - cron: "0 10,11,12 * * 0-4"
  workflow_dispatch:
    inputs:
      force_run:
        description: "تجاهل مواعيد السوق (للتجربة اليدوية بس)"
        required: false
        default: "false"
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run monitor
        env:
          # GGRN اتشال: مش مغطى في yfinance/Yahoo Finance خالص (اتدرج
          # في سوق النيل يوليو 2024، مفيش بيانات عنه في المصدر ده)
          TICKERS: "ABUK.CA,ADIB.CA,ALCN.CA,AMOC.CA,BTFH.CA,CCAP.CA,CLHO.CA,COMI.CA,EAST.CA,EFID.CA,EFIH.CA,EGAL.CA,EMFD.CA,ETEL.CA,FWRY.CA,GBCO.CA,HELI.CA,HRHO.CA,ISPH.CA,JUFO.CA,MCQE.CA,MFPC.CA,ORAS.CA,ORHD.CA,PHDC.CA,RAYA.CA,RMDA.CA,SKPC.CA,TMGH.CA,VLMR.CA,VLMRA.CA"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: python monitor_once.py
      - name: Commit updated state
        run: |
          git config user.name "alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          # alert_log.csv بيتعمل بس أول ما يحصل تنبيه فعلي - لسه مش
          # موجود في أول تشغيلات، فبنضيفه بس لو موجود عشان الأمر
          # ميفشلش
          if [ -f alert_log.csv ]; then
            git add alert_log.csv
          fi
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git push
