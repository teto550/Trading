name: Live Stock Monitor

on:
  schedule:
    # كل 15 دقيقة، من 6 لـ 12 بتوقيت UTC (بيغطي مواعيد EGX مع هامش
    # أمان يراعي تغيير التوقيت الصيفي/الشتوي)، الأحد للخميس فقط
    - cron: "*/15 6-12 * * 0-4"
  workflow_dispatch:
    inputs:
      force_run:
        description: "تجاهل مواعيد السوق (للتجربة اليدوية بس)"
        required: false
        default: "false"

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
       env:
          TICKERS: "COMI.CA,GGRN.CA,EFIH.CA,EFID.CA,ABUK.CA"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: python monitor_once.py

      - name: Commit updated state
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git push

