name: Live Stock Monitor
on:
  schedule:
    # الأحد للخميس. مواعيد UTC:
    #  7 و8   = بداية الجلسة (تقرير الصبح) - 10 أو 9 الصبح بتوقيت القاهرة
    #  10 و11 = وسط الجلسة (تحديث الأسعار)
    #  12     = قرب القفل/بعده (سعر الإقفال وتقرير نهاية الجلسة)
    #  12:30  = احتياطي لتقرير نهاية الجلسة لو الـ run اللي قبله اتأخر
    # (cron بتاع GitHub بيتأخر ومش مضمون، فالكود بيتعامل مع التأخير)
    # GitHub بيأخّر الـ cron ساعات أحيانًا ومرات بيسقّط runs، فبنطلب كل 30 دقيقة
    # (6:07-12:37 UTC) عشان على الأقل كام run ينزلوا جوه ساعات الجلسة.
    # الدقايق 7 و37 (مش 0 و30) لأن GitHub بيسقّط أكتر runs اللي على رأس الساعة ونصها
    - cron: "7,37 6-12 * * 0-4"
  workflow_dispatch:
    inputs:
      force_run:
        description: "تجاهل مواعيد السوق (للتجربة اليدوية بس)"
        required: false
        default: "false"
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run monitor
        env:
          # قايمة الأسهم بتتقري من tickers.txt (GGRN اتشال: مش مغطى في
          # yfinance خالص). لو حطيت TICKERS هنا هي اللي هتتاخد بدل الملف.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: python monitor_once.py
      - name: Commit updated state
        run: |
          git config user.name "alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          # alert_log.csv بيتعمل بس أول ما يحصل تنبيه فعلي - لسه مش
          # موجود في أول تشغيلات، فبنضيفه بس لو موجود عشان الأمر
          # ميفشلش
          if [ -f alert_log.csv ]; then
            git add alert_log.csv
          fi
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          # لو حد عمل push في نفس الوقت (أو run يدوي) الـ push العادي بيفشل
          for i in 1 2 3 4 5 6; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" || true
            git push && break
            echo "push race, retry $i"; sleep $((RANDOM % 8 + 3))
          done
