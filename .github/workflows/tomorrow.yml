name: EGX Tomorrow Report
on:
  schedule:
    # الأحد للخميس بعد القفل بكتير (القفل 2:30 بتوقيت القاهرة = 11:30 UTC) عشان Yahoo يكون حدّث أسعار اليوم.
    # 16:47 UTC = 7:47 مساءً بتوقيت القاهرة تقريبًا. بنتجنب :00 و:30 عشان GitHub بيأخّر/بيسقّط الـ cron وقتها
    - cron: "47 16 * * 0-4"
    # تقرير بداية الجلسة: 6:17 UTC = 9:17 صباحًا بالقاهرة (الافتتاح 10:00)، الأحد للخميس
    - cron: "17 6 * * 0-4"
  workflow_dispatch:
concurrency:
  group: tomorrow-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backtest/requirements.txt
      - name: Entry/exit signals (swing engine + paper portfolio)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p signals forecast data
          set -o pipefail
          python -u backtest/signals_report.py --fresh 2>&1 | tee signals/log_latest.txt
      - name: Build tomorrow's session report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p tomorrow news
          set -o pipefail
          python -u backtest/tomorrow_report.py 2>&1 | tee tomorrow/log_latest.txt
      - name: Commit report
        if: always()
        run: |
          git config user.name "alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A tomorrow
          [ -d signals ] && git add -A signals || true
          [ -d news ] && git add -A news || true
          [ -d forecast ] && git add -A forecast || true
          [ -d data ] && git add -A data || true
          git diff --cached --quiet || git commit -m "tomorrow report [skip ci]"
          for i in 1 2 3 4 5 6; do
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME:-main}" || true
            git push && break
            echo "push race, retry $i"; sleep $((RANDOM % 8 + 3))
          done
