name: EGX Backtest
on:
  # تشغيل يدوي بس: Actions -> EGX Backtest -> Run workflow
  workflow_dispatch:
    inputs:
      cost_bps:
        description: "تكلفة الاتجاه الواحد بالـ bps (15 = 0.15%)"
        required: false
        default: "15"
      min_turnover:
        description: "حد السيولة: أقل متوسط تداول يومي بالجنيه"
        required: false
        default: "1000000"
concurrency:
  group: backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backtest/requirements.txt
      - name: Run walk-forward backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python backtest/backtest.py --source yfinance \
            --cost-bps "${{ github.event.inputs.cost_bps || '15' }}" \
            --min-turnover "${{ github.event.inputs.min_turnover || '1000000' }}"
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backtest/results/
      - name: Commit results
        run: |
          git config user.name "alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backtest/results/report_latest.md backtest/results/results_latest.json
          git diff --cached --quiet || git commit -m "backtest results [skip ci]"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" || true
          git push
