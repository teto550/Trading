name: EGX Backtest
on:
  # تشغيل يدوي بس: Actions -> EGX Backtest -> Run workflow
  workflow_dispatch:
    inputs:
      cost_bps:
        description: "تكلفة الاتجاه الواحد بالـ bps (20 = 0.2%، متوسط تكلفتك الفعلية من صفقاتك)"
        required: false
        default: "15"
      min_turnover:
        description: "حد السيولة: أقل متوسط تداول يومي بالجنيه"
        required: false
        default: "1000000"
concurrency:
  group: backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backtest/requirements.txt
      - name: Run walk-forward backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p backtest/results
          set -o pipefail
          python -u backtest/backtest.py --source yfinance \
            --cost-bps "${{ github.event.inputs.cost_bps || '20' }}" \
            --min-turnover "${{ github.event.inputs.min_turnover || '1000000' }}" \
            2>&1 | tee backtest/results/log_latest.txt
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backtest/results/
      - name: Commit results
        if: always()
        run: |
          git config user.name "alert-bot"
          git config user.email "bot@users.noreply.github.com"
          # على النجاح بنشيل ملف الخطأ القديم؛ على الفشل بيفضل error_latest.txt + اللوج
          if [ -f backtest/results/report_latest.md ] && [ -f backtest/results/error_latest.txt ] \
             && [ backtest/results/report_latest.md -nt backtest/results/error_latest.txt ]; then
            git rm -q --ignore-unmatch backtest/results/error_latest.txt || true
          fi
          # لازم نضيف المجلد كله: git add بمسارات مش موجودة بيفشل ومبيضيفش ولا حاجة
          git add -A backtest/results
          git diff --cached --quiet || git commit -m "backtest results [skip ci]"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" || true
            git push && break
            echo "push race, retry $i"; sleep $((RANDOM % 8 + 3))
          done
