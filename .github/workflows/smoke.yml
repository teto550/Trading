name: Smoke test (branch only)
on:
  push:
    branches: [upgrade-signals]
    paths: [.github/workflows/smoke.yml]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r backtest/requirements.txt
      - name: live price source
        run: |
          python - <<'P'
          import egxdata, monitor_once as mo
          s = egxdata.tv_snapshot(); print("TV symbols:", len(s)); print({k: s[k] for k in ("COMI","SWDY","EFIH") if k in s})
          print("record_today ->", egxdata.record_today())
          for t in ("COMI.CA","ABUK.CA"):
              try: print(t, mo.fetch_price(t))
              except Exception as e: print(t, "ERR", e)
          P
      - name: signals (no telegram, no record)
        run: python -u backtest/signals_report.py --fresh --no-telegram 2>&1 | grep -v "possibly delisted" | tail -80
      - name: tomorrow report (no telegram, no record)
        run: python -u backtest/tomorrow_report.py --no-telegram --no-record --no-news 2>&1 | grep -v "possibly delisted" | head -40
      - name: bot lookup
        run: |
          cd backtest && python - <<'P'
          import forecast_lookup as fl
          print(fl.forecast_text("COMI"))
          P
