name: Smoke test (branch only)
on:
  push:
    branches: [upgrade-signals]
    paths: [.github/workflows/smoke.yml]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r backtest/requirements.txt
      - name: signals (real data, account, no telegram)
        run: python -u backtest/signals_report.py --fresh --no-telegram 2>&1 | grep -v "possibly delisted\|^\[data\]" | tail -60
      - name: portfolio command + live tick
        run: |
          python - <<'P'
          import sys, monitor_once as mo
          sys.path.insert(0, "backtest")
          import paper_account as pa, egxdata
          from datetime import datetime
          print(mo.paper_portfolio_text())
          print("tick ->", pa.live_tick(egxdata.tv_snapshot(), datetime.now(pa.TZ), pa.live_params(), print))
          P
      - name: tomorrow report labels
        run: python -u backtest/tomorrow_report.py --no-telegram --no-record --no-news 2>&1 | grep -E "^[0-9]+\. " | head -10
# v2
