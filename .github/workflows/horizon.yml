name: EGX 5-10 Day Picks
on:
  schedule:
    # الأحد للخميس بعد القفل بكتير (القفل 2:30 بتوقيت القاهرة = 11:30 UTC). 17:42 UTC = 8:42 مساءً بالقاهرة تقريبًا.
    # بنتجنب :00 و:30 عشان GitHub بيأخّر/بيسقّط الـ cron وقتها
    - cron: "42 17 * * 0-4"
  workflow_dispatch:
concurrency:
  group: horizon-report
  cancel-in-progress: false
jobs:
  horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backtest/requirements.txt
      - name: Build 5/10-day picks and score matured ones
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p horizon news
          set -o pipefail
          python -u backtest/horizon_report.py --fresh 2>&1 | tee horizon/log_latest.txt
      - name: Commit picks and scorecard
        if: always()
        run: |
          git config user.name "alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A horizon
          [ -d news ] && git add -A news || true
          [ -d forecast ] && git add -A forecast || true
          git diff --cached --quiet || git commit -m "horizon picks update [skip ci]"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" || true
            git push && break
            echo "push race, retry $i"; sleep $((RANDOM % 8 + 3))
          done
